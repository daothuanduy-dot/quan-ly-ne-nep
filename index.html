<!-- TAB 1: BÁO VẮNG -->
      <section id="content-tab-1" class="tab-content hidden space-y-4">
        <h2 class="text-lg font-bold text-blue-700 uppercase flex items-center gap-2"><i class="fa-solid fa-user-slash"></i> 1. Báo Học Sinh Vắng Trong Ngày</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Chọn Khối:</label>
            <select id="bv-khoi" onchange="onBaoVangKhoiChange()" class="w-full border p-2.5 rounded-lg text-sm bg-white">
              <option value="">-- Tất cả Khối --</option>
              <option value="10">Khối 10</option>
              <option value="11">Khối 11</option>
              <option value="12">Khối 12</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Chọn Lớp:</label>
            <select id="bv-lop" onchange="onBaoVangLopChange()" class="w-full border p-2.5 rounded-lg text-sm bg-white">
              <option value="">-- Chọn Lớp --</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Số lượng vắng:</label>
            <input type="number" id="bv-soluong" value="1" min="1" max="30" onchange="renderBaoVangRows()" oninput="renderBaoVangRows()" class="w-full border p-2.5 rounded-lg text-sm font-bold text-center bg-white text-blue-600">
          </div>
        </div>
        <div class="space-y-3">
          <label class="block font-bold text-gray-700 text-sm">Danh sách học sinh vắng:</label>
          <div id="bv-student-rows" class="space-y-3"></div>
        </div>
        <button onclick="submitBaoVang()" class="w-full btn-coral py-3 rounded-xl font-bold uppercase shadow-md"><i class="fa-solid fa-floppy-disk"></i> LƯU THÔNG TIN BÁO VẮNG</button>
      </section>
