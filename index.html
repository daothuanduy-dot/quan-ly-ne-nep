<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f8f83">
<meta name="description" content="Quản lý nề nếp, thi đua và kết quả học tập THPT Lê Hồng Phong.">
<link rel="manifest" href="./manifest.webmanifest?v=3.0.5.25.33">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Quản lý nề nếp & thi đua — V3.0.5.25.33</title>
<link rel="stylesheet" href="./css/app.css?v=3.0.5.25.33">
<script src="https://unpkg.com/html5-qrcode" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="brand"><div class="brand-icon">🏫</div><h1>Quản lý nề nếp & thi đua</h1><p>THPT Lê Hồng Phong · V3.0.5.25.33</p></div>
    <form id="loginForm">
      <label>Đăng nhập với vai trò<select id="loginRole" required><option value="staff">Cán bộ / Giáo viên</option><option value="parent">Phụ huynh học sinh</option><option value="student">Học sinh</option></select></label>
      <label id="loginIdLabel">Mã cán bộ<input id="username" autocomplete="username" required></label>
      <label>Mật khẩu
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" required>
          <button id="togglePassword" class="password-toggle" type="button" aria-label="Hiển thị mật khẩu" title="Hiển thị mật khẩu">👁</button>
        </div>
      </label>
      <label class="remember-row">
        <input id="rememberMe" type="checkbox">
        <span>Ghi nhớ thông tin đăng nhập</span>
      </label>
      <button class="btn primary full" type="submit">Đăng nhập</button>
      <button id="installAppLoginBtn" class="btn light full" type="button" style="margin-top:8px">＋ Cài ứng dụng</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<div id="portalView" class="portal-view hidden"></div>
<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brand-mini"><span class="brand-icon small">🏫</span><div><b>THPT Lê Hồng Phong</b><small>Quản lý nề nếp & thi đua · V3.0.5.25.33</small></div></div>
    <div class="top-actions"><button id="installAppBtn" class="btn light hidden" type="button">＋ Cài ứng dụng</button><button id="enablePushBtn" class="btn light" type="button">🔔 Bật thông báo</button><div id="yearBox" class="year-badge">Năm học 2026-2027</div><div id="userBox"></div><button id="logoutBtn" class="btn light">Đăng xuất</button></div>
  </header>
  <nav id="mainTabs" class="main-tabs">
    <button class="main-tab" data-tab="qr">📷 <span>Quét QR thẻ HS</span></button>
    <button class="main-tab" data-tab="baovang">📋 <span>Báo Vắng Học Sinh</span></button>
    <button class="main-tab" data-tab="chamdiem">⭐ <span>Chấm Điểm Thi Đua</span></button>
    <button class="main-tab" data-tab="thongke">📊 <span>Thống Kê Biểu Đồ</span></button>
    <button class="main-tab" data-tab="xeploai">🏆 <span>Xếp Loại & Danh Hiệu</span></button>
    <button class="main-tab" data-tab="quantri">⚙️ <span>Quản Trị Hệ Thống</span></button>
    <button class="main-tab hidden" data-tab="resetpw">🔑 <span>Reset mật khẩu PH</span></button>
    <button class="main-tab hidden" data-tab="notices">📢 <span>Thông báo</span></button>
  </nav>

  <main>
    <section id="page-qr" class="page hidden"></section>
    <section id="page-baovang" class="page hidden"></section>
    <section id="page-chamdiem" class="page hidden"></section>
    <section id="page-thongke" class="page hidden"></section>
    <section id="page-xeploai" class="page hidden"></section>
    <section id="page-resetpw" class="page hidden"></section>
    <section id="page-notices" class="page hidden"></section>
    <section id="page-quantri" class="page hidden">
      <div class="panel">
        <div id="adminContent"></div>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<div id="modalRoot"></div>
<script src="./js/pwa.js?v=3.0.5.25.33"></script>
<script src="./js/login-bootstrap.js?v=3.0.5.25.33"></script>
</body>
</html>
